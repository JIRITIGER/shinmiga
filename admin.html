<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신미가 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1628; --ocean:#1a4a7a; --teal:#1a8fa0;
  --gold:#c8a84b; --gold-light:#e8c96b;
  --bg:#f0f4f8; --card:#ffffff;
  --text:#1a1a2e; --mid:#4a5568; --light:#718096;
  --green:#16a34a; --red:#dc2626; --amber:#d97706;
  --border:#e2e8f0;
  --sh:0 2px 12px rgba(10,22,40,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── 로그인 화면 ── */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;background:var(--navy);
}
.login-box{
  background:#fff;border-radius:20px;padding:2.5rem 2rem;
  width:min(360px,92vw);text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.login-logo{font-size:2rem;margin-bottom:0.4rem;}
.login-title{font-size:1.3rem;font-weight:700;color:var(--navy);margin-bottom:0.3rem;}
.login-sub{font-size:0.8rem;color:var(--light);margin-bottom:1.8rem;}
.login-input{
  width:100%;padding:0.85rem 1rem;border:1.5px solid var(--border);
  border-radius:10px;font-size:1rem;font-family:inherit;
  margin-bottom:1rem;outline:none;transition:border 0.2s;
}
.login-input:focus{border-color:var(--gold);}
.login-btn{
  width:100%;padding:0.9rem;background:var(--navy);color:#fff;
  border:none;border-radius:10px;font-size:1rem;font-weight:700;
  font-family:inherit;cursor:pointer;transition:background 0.2s;
}
.login-btn:hover{background:var(--ocean);}
.login-err{color:var(--red);font-size:0.82rem;margin-top:0.6rem;display:none;}

/* ── 메인 앱 ── */
#app{display:none;}
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--navy);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.2rem;height:58px;
  box-shadow:0 2px 12px rgba(0,0,0,0.3);
}
.tb-title{color:var(--gold);font-size:1rem;font-weight:700;letter-spacing:0.5px;}
.tb-right{display:flex;gap:0.6rem;align-items:center;}
.tb-badge{
  background:var(--red);color:#fff;border-radius:50px;
  padding:0.15rem 0.55rem;font-size:0.7rem;font-weight:700;
  display:none;
}
.tb-btn{
  background:rgba(255,255,255,0.1);border:none;color:#fff;
  padding:0.4rem 0.8rem;border-radius:8px;font-size:0.78rem;
  font-family:inherit;cursor:pointer;transition:background 0.2s;
}
.tb-btn:hover{background:rgba(255,255,255,0.2);}

.wrap{max-width:900px;margin:0 auto;padding:1.2rem 1rem 4rem;}

/* ── 요약 카드 ── */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.8rem;margin-bottom:1.4rem;}
@media(max-width:600px){.summary-grid{grid-template-columns:repeat(2,1fr);}}
.sum-card{
  background:var(--card);border-radius:14px;padding:1rem;
  box-shadow:var(--sh);text-align:center;
}
.sum-num{font-size:1.8rem;font-weight:700;color:var(--navy);}
.sum-lbl{font-size:0.72rem;color:var(--light);margin-top:0.2rem;}

/* ── 탭 ── */
.tabs{display:flex;gap:0.5rem;margin-bottom:1.2rem;}
.tab-btn{
  padding:0.55rem 1.1rem;border-radius:20px;border:none;
  font-family:inherit;font-size:0.82rem;font-weight:600;
  cursor:pointer;transition:all 0.2s;
  background:var(--card);color:var(--mid);
  box-shadow:var(--sh);
}
.tab-btn.active{background:var(--navy);color:#fff;}

/* ── 예약 카드 ── */
.res-list{display:flex;flex-direction:column;gap:0.8rem;}
.res-card{
  background:var(--card);border-radius:14px;padding:1.1rem 1.2rem;
  box-shadow:var(--sh);border-left:4px solid var(--border);
  transition:box-shadow 0.2s;
}
.res-card:hover{box-shadow:0 4px 20px rgba(10,22,40,0.15);}
.res-card.pending{border-left-color:var(--amber);}
.res-card.confirmed{border-left-color:var(--green);}
.res-card.cancelled{border-left-color:#94a3b8;opacity:0.6;}
.res-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.7rem;}
.res-name{font-size:1rem;font-weight:700;color:var(--navy);}
.res-room{font-size:0.75rem;color:var(--teal);font-weight:600;margin-top:0.15rem;}
.status-badge{
  padding:0.2rem 0.65rem;border-radius:50px;
  font-size:0.7rem;font-weight:700;white-space:nowrap;
}
.status-badge.pending{background:#fef3c7;color:#92400e;}
.status-badge.confirmed{background:#dcfce7;color:#14532d;}
.status-badge.cancelled{background:#f1f5f9;color:#64748b;}
.res-meta{display:flex;flex-wrap:wrap;gap:0.6rem;margin-bottom:0.8rem;}
.meta-item{
  display:flex;align-items:center;gap:0.3rem;
  font-size:0.78rem;color:var(--mid);
  background:#f8fafc;padding:0.25rem 0.6rem;border-radius:6px;
}
.res-total{
  font-size:0.95rem;font-weight:700;color:var(--navy);
  margin-bottom:0.8rem;
}
.res-note{
  font-size:0.78rem;color:var(--mid);
  background:#fffbeb;padding:0.4rem 0.7rem;
  border-radius:6px;margin-bottom:0.8rem;
  display:none;
}
.res-actions{display:flex;gap:0.5rem;flex-wrap:wrap;}
.act-btn{
  padding:0.45rem 0.9rem;border-radius:8px;border:none;
  font-size:0.78rem;font-weight:600;font-family:inherit;
  cursor:pointer;transition:all 0.2s;
}
.act-confirm{background:#dcfce7;color:#15803d;}
.act-confirm:hover{background:#bbf7d0;}
.act-cancel{background:#fee2e2;color:#b91c1c;}
.act-cancel:hover{background:#fecaca;}
.act-call{background:#e0f2fe;color:#0369a1;}
.act-call:hover{background:#bae6fd;}
.act-kakao{background:#fef9c3;color:#92400e;}
.act-kakao:hover{background:#fef08a;}
.act-delete{background:#f1f5f9;color:#64748b;}
.act-delete:hover{background:#e2e8f0;}

/* ── 예약 날짜 입력 (관리자 직접 추가) ── */
.add-form{
  background:var(--card);border-radius:14px;padding:1.3rem;
  box-shadow:var(--sh);margin-bottom:1.4rem;
}
.add-title{font-size:0.95rem;font-weight:700;margin-bottom:1rem;color:var(--navy);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.7rem;}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.af-label{font-size:0.75rem;color:var(--mid);margin-bottom:0.3rem;font-weight:600;}
.af-input,.af-sel{
  width:100%;padding:0.6rem 0.8rem;
  border:1.5px solid var(--border);border-radius:8px;
  font-family:inherit;font-size:0.85rem;outline:none;
  background:#fff;transition:border 0.2s;
}
.af-input:focus,.af-sel:focus{border-color:var(--gold);}
.af-submit{
  width:100%;padding:0.75rem;background:var(--navy);color:#fff;
  border:none;border-radius:10px;font-size:0.9rem;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:0.3rem;
  transition:background 0.2s;
}
.af-submit:hover{background:var(--ocean);}

/* ── 달력 뷰 ── */
.cal-wrap{background:var(--card);border-radius:14px;padding:1.2rem;box-shadow:var(--sh);}
.cal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
.cal-title{font-size:1rem;font-weight:700;color:var(--navy);}
.cal-navs{display:flex;gap:0.4rem;}
.cnav{
  background:var(--bg);border:none;width:32px;height:32px;
  border-radius:8px;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.2s;
}
.cnav:hover{background:var(--border);}
.cal-grid-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
.cal-dh{text-align:center;font-size:0.7rem;font-weight:600;color:var(--light);padding:0.3rem 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cday{
  min-height:52px;border-radius:8px;padding:0.3rem;
  font-size:0.75rem;background:#f8fafc;
  position:relative;cursor:default;
}
.cday.avail{background:#f0fdf4;}
.cday.today{outline:2px solid var(--gold);outline-offset:-2px;}
.cday.past{opacity:0.35;}
.cday.bk-a{background:#fee2e2;}
.cday.bk-b{background:#dbeafe;}
.cday.bk-both{background:#ede9fe;}
.cday.bk-dok{background:#fef3c7;}
.dnum{font-weight:600;color:var(--navy);}
.cday.past .dnum{color:var(--light);}
.ddots{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;}
.ddot{width:7px;height:7px;border-radius:50%;}
.dot-a{background:#ef4444;}
.dot-b{background:#3b82f6;}
.dot-dok{background:#f59e0b;}
.cal-legend{display:flex;flex-wrap:wrap;gap:0.6rem;margin-top:0.8rem;}
.leg{display:flex;align-items:center;gap:0.3rem;font-size:0.72rem;color:var(--mid);}
.leg-dot{width:10px;height:10px;border-radius:50%;}

/* ── 빈 상태 ── */
.empty-state{
  text-align:center;padding:3rem 1rem;color:var(--light);
}
.empty-ico{font-size:2.5rem;margin-bottom:0.5rem;}

/* ── 토스트 ── */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#1a1a2e;color:#fff;
  padding:0.7rem 1.4rem;border-radius:50px;
  font-size:0.85rem;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:9999;
  white-space:nowrap;
}
.toast.show{opacity:1;}

/* ── 모달 ── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.5);z-index:500;
  align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:#fff;border-radius:16px;padding:1.5rem;
  width:min(340px,90vw);text-align:center;
}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:0.6rem;}
.modal-desc{font-size:0.85rem;color:var(--mid);margin-bottom:1.2rem;}
.modal-btns{display:flex;gap:0.6rem;}
.modal-btns button{flex:1;padding:0.7rem;border-radius:10px;border:none;font-family:inherit;font-size:0.88rem;font-weight:700;cursor:pointer;}
.mbtn-cancel{background:var(--bg);color:var(--mid);}
.mbtn-confirm{background:var(--red);color:#fff;}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🏠</div>
    <div class="login-title">신미가 관리자</div>
    <div class="login-sub">예약 관리 시스템</div>
    <input type="password" class="login-input" id="pw-input" placeholder="비밀번호 입력"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-err" id="login-err">비밀번호가 틀렸습니다.</div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <!-- 탑바 -->
  <div class="topbar">
    <div class="tb-title">🏠 신미가 관리자</div>
    <div class="tb-right">
      <span class="tb-badge" id="pending-badge">0</span>
      <button class="tb-btn" onclick="window.open('https://shinmiga.co.kr','_blank')">🌐 사이트</button>
      <button class="tb-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="wrap">

    <!-- 요약 카드 -->
    <div class="summary-grid">
      <div class="sum-card">
        <div class="sum-num" id="s-pending" style="color:var(--amber)">0</div>
        <div class="sum-lbl">⏳ 입금 대기</div>
      </div>
      <div class="sum-card">
        <div class="sum-num" id="s-confirmed" style="color:var(--green)">0</div>
        <div class="sum-lbl">✅ 확정</div>
      </div>
      <div class="sum-card">
        <div class="sum-num" id="s-total">0</div>
        <div class="sum-lbl">📅 이번달 예약</div>
      </div>
      <div class="sum-card">
        <div class="sum-num" id="s-revenue" style="font-size:1.1rem">0</div>
        <div class="sum-lbl">💰 이번달 수입</div>
      </div>
    </div>

    <!-- 탭 -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('list',this)">📋 예약 목록</button>
      <button class="tab-btn" onclick="switchTab('cal',this)">📅 달력</button>
      <button class="tab-btn" onclick="switchTab('add',this)">➕ 직접 등록</button>
    </div>

    <!-- 예약 목록 탭 -->
    <div id="tab-list">
      <div class="tabs" style="margin-bottom:0.8rem;">
        <button class="tab-btn active" id="filter-all" onclick="filterRes('all',this)">전체</button>
        <button class="tab-btn" id="filter-pending" onclick="filterRes('pending',this)">⏳ 대기</button>
        <button class="tab-btn" id="filter-confirmed" onclick="filterRes('confirmed',this)">✅ 확정</button>
        <button class="tab-btn" id="filter-cancelled" onclick="filterRes('cancelled',this)">❌ 취소</button>
      </div>
      <div class="res-list" id="res-list">
        <div class="empty-state"><div class="empty-ico">📭</div><div>예약 데이터를 불러오는 중...</div></div>
      </div>
    </div>

    <!-- 달력 탭 -->
    <div id="tab-cal" style="display:none">
      <div class="cal-wrap">
        <div class="cal-hdr">
          <div class="cal-title" id="a-cal-title"></div>
          <div class="cal-navs">
            <button class="cnav" onclick="aCalChange(-1)">‹</button>
            <button class="cnav" onclick="aCalChange(1)">›</button>
          </div>
        </div>
        <div class="cal-grid-hdr">
          <div class="cal-dh">일</div><div class="cal-dh">월</div>
          <div class="cal-dh">화</div><div class="cal-dh">수</div>
          <div class="cal-dh">목</div><div class="cal-dh">금</div>
          <div class="cal-dh">토</div>
        </div>
        <div class="cal-grid" id="a-cal-grid"></div>
        <div class="cal-legend">
          <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>6호실</div>
          <div class="leg"><div class="leg-dot" style="background:#3b82f6"></div>7호실</div>
          <div class="leg"><div class="leg-dot" style="background:#f59e0b"></div>독채</div>
          <div class="leg"><div class="leg-dot" style="background:#8b5cf6"></div>전체 마감</div>
        </div>
      </div>
    </div>

    <!-- 직접 등록 탭 -->
    <div id="tab-add" style="display:none">
      <div class="add-form">
        <div class="add-title">📝 전화/현장 예약 직접 등록</div>
        <div class="form-row">
          <div>
            <div class="af-label">예약자 이름 *</div>
            <input class="af-input" id="af-name" placeholder="홍길동">
          </div>
          <div>
            <div class="af-label">연락처 *</div>
            <input class="af-input" id="af-phone" placeholder="010-0000-0000" type="tel">
          </div>
        </div>
        <div class="form-row">
          <div>
            <div class="af-label">객실 *</div>
            <select class="af-sel" id="af-room">
              <option value="">선택</option>
              <option value="신미가 독채">신미가 독채 (300,000원)</option>
              <option value="신미가 7호실">신미가 7호실 (160,000원)</option>
              <option value="신미가 6호실">신미가 6호실 (200,000원)</option>
            </select>
          </div>
          <div>
            <div class="af-label">인원</div>
            <select class="af-sel" id="af-guests">
              <option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div>
            <div class="af-label">체크인 *</div>
            <input class="af-input" id="af-ci" type="date">
          </div>
          <div>
            <div class="af-label">체크아웃 *</div>
            <input class="af-input" id="af-co" type="date">
          </div>
        </div>
        <div class="form-row">
          <div>
            <div class="af-label">결제방법</div>
            <select class="af-sel" id="af-pay">
              <option value="transfer">계좌이체</option>
              <option value="kakao">카카오페이</option>
              <option value="cash">현금</option>
              <option value="phone">전화예약</option>
            </select>
          </div>
          <div>
            <div class="af-label">상태</div>
            <select class="af-sel" id="af-status">
              <option value="confirmed">✅ 확정</option>
              <option value="pending">⏳ 입금대기</option>
            </select>
          </div>
        </div>
        <div>
          <div class="af-label">메모 (선택)</div>
          <input class="af-input" id="af-note" placeholder="특이사항, 요청사항 등">
        </div>
        <button class="af-submit" onclick="addManualRes()">예약 등록하기</button>
      </div>
    </div>

  </div><!-- wrap -->
</div><!-- app -->

<!-- 취소 확인 모달 -->
<div class="modal-overlay" id="cancel-modal">
  <div class="modal-box">
    <div class="modal-title">⚠️ 예약을 취소하시겠어요?</div>
    <div class="modal-desc">취소된 예약은 달력에서 자동으로 해제됩니다.</div>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeCancelModal()">아니오</button>
      <button class="mbtn-confirm" onclick="confirmCancel()">취소 확정</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
// ── Firebase 설정 ──
// ※ index.html과 동일한 값으로 교체하세요
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyB2iAIb3fYVVX4_OPqPKzeM7ug2zqeMBzA",
  authDomain:        "shinmiga-f0fe7.firebaseapp.com",
  databaseURL:       "https://shinmiga-f0fe7-default-rtdb.firebaseio.com",
  projectId:         "shinmiga-f0fe7",
  storageBucket:     "shinmiga-f0fe7.firebasestorage.app",
  messagingSenderId: "297727646836",
  appId:             "1:297727646836:web:a102b7088700edfdcdc521"
};

// 관리자 비밀번호 (Firebase 연결 전 로컬 체크용)
// ※ 실제 배포 시 변경 필수
const ADMIN_PW = "shinmiga2026";

// ── 전역 상태 ──
let db, refFn, pushFn, setFn, removeFn, updateFn, onValueFn;
let allReservations = {};
let currentFilter = 'all';
let cancelTargetId = null;

let aCalM = new Date().getMonth();
const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const PRICES = {'신미가 독채':300000,'신미가 7호실':160000,'신미가 6호실':200000};

// ── 로그인 ──
window.doLogin = function() {
  const pw = document.getElementById('pw-input').value;
  if (pw === ADMIN_PW) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initFirebase();
  } else {
    document.getElementById('login-err').style.display = 'block';
    document.getElementById('pw-input').value = '';
  }
};

window.doLogout = function() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
};

// ── Firebase 초기화 ──
async function initFirebase() {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getDatabase, ref, push, set, remove, update, onValue } =
      await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");

    const app = initializeApp(FIREBASE_CONFIG);
    db = getDatabase(app);
    refFn = ref; pushFn = push; setFn = set;
    removeFn = remove; updateFn = update; onValueFn = onValue;

    // 실시간 예약 데이터 수신
    onValue(ref(db, 'reservations'), (snapshot) => {
      allReservations = snapshot.val() || {};
      renderAll();
    });

    showToast('✅ Firebase 연결됨');
  } catch(e) {
    showToast('⚠️ Firebase 미연결 — 설정 확인 필요');
    console.error(e);
    renderAll(); // 빈 상태라도 렌더
  }
}

// ── 전체 렌더 ──
function renderAll() {
  updateSummary();
  renderResList();
  renderAdminCal();
  updatePendingBadge();
}

// ── 요약 카드 ──
function updateSummary() {
  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let pending=0, confirmed=0, monthCount=0, revenue=0;
  Object.values(allReservations).forEach(r => {
    if (r.status === 'pending') pending++;
    if (r.status === 'confirmed') confirmed++;
    if (r.checkin && r.checkin.startsWith(thisMonth)) {
      monthCount++;
      if (r.status !== 'cancelled') revenue += (r.total||0);
    }
  });
  document.getElementById('s-pending').textContent = pending;
  document.getElementById('s-confirmed').textContent = confirmed;
  document.getElementById('s-total').textContent = monthCount;
  document.getElementById('s-revenue').textContent =
    revenue > 0 ? (revenue/10000).toFixed(0)+'만원' : '0';
}

function updatePendingBadge() {
  const cnt = Object.values(allReservations).filter(r=>r.status==='pending').length;
  const badge = document.getElementById('pending-badge');
  badge.textContent = cnt;
  badge.style.display = cnt > 0 ? 'inline' : 'none';
}

// ── 예약 목록 렌더 ──
function renderResList() {
  const list = document.getElementById('res-list');
  let items = Object.entries(allReservations);

  // 정렬: 최신순
  items.sort((a,b) => (b[1].createdAt||'').localeCompare(a[1].createdAt||''));

  // 필터
  if (currentFilter !== 'all') {
    items = items.filter(([,r]) => r.status === currentFilter);
  }

  if (items.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-ico">📭</div>
      <div>${currentFilter==='all'?'아직 예약이 없습니다.':'해당 상태의 예약이 없습니다.'}</div></div>`;
    return;
  }

  list.innerHTML = items.map(([id, r]) => {
    const statusLabel = {pending:'⏳ 입금대기', confirmed:'✅ 확정', cancelled:'❌ 취소'}[r.status] || r.status;
    const nights = r.nights || (r.checkin && r.checkout ?
      Math.round((new Date(r.checkout)-new Date(r.checkin))/(86400000)) : 1);
    const noteHTML = r.note ? `<div class="res-note" style="display:block">💬 ${r.note}</div>` : '';
    return `
    <div class="res-card ${r.status}">
      <div class="res-header">
        <div>
          <div class="res-name">${r.name||'이름없음'}</div>
          <div class="res-room">${r.room||''}</div>
        </div>
        <span class="status-badge ${r.status}">${statusLabel}</span>
      </div>
      <div class="res-meta">
        <div class="meta-item">📅 ${r.checkin||''} ~ ${r.checkout||''}</div>
        <div class="meta-item">🌙 ${nights}박</div>
        <div class="meta-item">👥 ${r.guests||2}인</div>
        <div class="meta-item">💳 ${r.payment==='transfer'?'계좌이체':r.payment==='kakao'?'카카오페이':r.payment||'-'}</div>
      </div>
      <div class="res-total">💰 ${(r.total||0).toLocaleString()}원</div>
      ${noteHTML}
      <div class="res-actions">
        ${r.status==='pending' ? `<button class="act-btn act-confirm" onclick="confirmRes('${id}')">✅ 입금확인</button>` : ''}
        ${r.status!=='cancelled' ? `<button class="act-btn act-cancel" onclick="openCancelModal('${id}')">❌ 취소</button>` : ''}
        <button class="act-btn act-call" onclick="window.location.href='tel:${r.phone||''}'">📞 전화</button>
        <button class="act-btn act-kakao" onclick="window.open('https://pf.kakao.com/_신미가민박','_blank')">💬 카카오</button>
        `<button class="act-btn act-delete" onclick="deleteRes('${id}')">🗑 삭제</button>`
      </div>
    </div>`;
  }).join('');
}

// ── 예약 확정 ──
window.confirmRes = async function(id) {
  if (!db) { showToast('Firebase 미연결'); return; }
  await updateFn(refFn(db, `reservations/${id}`), { status: 'confirmed' });
  showToast('✅ 예약이 확정되었습니다.');
};

// ── 취소 모달 ──
window.openCancelModal = function(id) {
  cancelTargetId = id;
  document.getElementById('cancel-modal').classList.add('open');
};
window.closeCancelModal = function() {
  document.getElementById('cancel-modal').classList.remove('open');
  cancelTargetId = null;
};
window.confirmCancel = async function() {
  if (!cancelTargetId || !db) return;
  await updateFn(refFn(db, `reservations/${cancelTargetId}`), { status: 'cancelled' });
  window.closeCancelModal();
  showToast('취소 처리되었습니다.');
};

// ── 예약 삭제 (취소된 것만) ──
window.deleteRes = async function(id) {
  if (!db) { showToast('Firebase 미연결'); return; }
  if (!confirm('이 예약을 완전히 삭제하시겠어요?')) return;
  await removeFn(refFn(db, `reservations/${id}`));
  showToast('삭제되었습니다.');
};

// ── 필터 ──
window.filterRes = function(f, btn) {
  currentFilter = f;
  document.querySelectorAll('#tab-list .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderResList();
};

// ── 직접 등록 ──
window.addManualRes = async function() {
  const name  = document.getElementById('af-name').value.trim();
  const phone = document.getElementById('af-phone').value.trim();
  const room  = document.getElementById('af-room').value;
  const ci    = document.getElementById('af-ci').value;
  const co    = document.getElementById('af-co').value;
  if (!name||!phone||!room||!ci||!co) { showToast('❌ 필수 항목을 모두 입력해 주세요.'); return; }
  const nights = Math.round((new Date(co)-new Date(ci))/86400000);
  const total  = (PRICES[room]||0)*nights;
  const data = {
    name, phone, room,
    checkin:ci, checkout:co,
    guests: parseInt(document.getElementById('af-guests').value)||2,
    nights, total,
    payment: document.getElementById('af-pay').value,
    status:  document.getElementById('af-status').value,
    note:    document.getElementById('af-note').value.trim(),
    createdAt: new Date().toISOString()
  };
  if (db) {
    await pushFn(refFn(db,'reservations'), data);
    showToast('✅ 예약이 등록되었습니다.');
    ['af-name','af-phone','af-ci','af-co','af-note'].forEach(id=>{
      document.getElementById(id).value='';
    });
  } else {
    showToast('⚠️ Firebase 미연결 — 저장 불가');
  }
};

// ── 관리자 달력 ──
function renderAdminCal() {
  const grid   = document.getElementById('a-cal-grid');
  const title  = document.getElementById('a-cal-title');
  if (!grid) return;
  title.textContent = `${aCalY}년 ${MONTHS[aCalM]}`;
  const first  = new Date(aCalY, aCalM, 1).getDay();
  const days   = new Date(aCalY, aCalM+1, 0).getDate();
  const today  = new Date();

  // 달력용 예약 맵 생성
  const calMap = {};
  Object.values(allReservations).forEach(r => {
    if (r.status === 'cancelled') return;
    let cur = new Date(r.checkin);
    const end = new Date(r.checkout);
    while (cur < end) {
      const ds = cur.toISOString().split('T')[0];
      if (!calMap[ds]) calMap[ds] = [];
      calMap[ds].push(r.room);
      cur.setDate(cur.getDate()+1);
    }
  });

  grid.innerHTML = '';
  for (let i=0;i<first;i++){
    const e=document.createElement('div');e.className='cday empty';grid.appendChild(e);
  }
  for (let d=1;d<=days;d++){
    const ds=`${aCalY}-${String(aCalM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell=document.createElement('div');
    const isPast=new Date(aCalY,aCalM,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const isToday=new Date(aCalY,aCalM,d).toDateString()===today.toDateString();
    const rooms=calMap[ds]||[];
    const has6=rooms.includes('신미가 6호실');
    const has7=rooms.includes('신미가 7호실');
    const hasDok=rooms.includes('신미가 독채');

    let cls='cday';
    if(isPast)cls+=' past';
    if(isToday)cls+=' today';
    if(hasDok)cls+=' bk-dok';
    else if(has6&&has7)cls+=' bk-both';
    else if(has6)cls+=' bk-a';
    else if(has7)cls+=' bk-b';
    else if(!isPast)cls+=' avail';

    cell.className=cls;
    cell.innerHTML=`<div class="dnum">${d}</div>`;
    if(rooms.length>0&&!isPast){
      const dots=document.createElement('div');dots.className='ddots';
      if(hasDok){const dot=document.createElement('div');dot.className='ddot dot-dok';dots.appendChild(dot);}
      else{
        if(has6){const dot=document.createElement('div');dot.className='ddot dot-a';dots.appendChild(dot);}
        if(has7){const dot=document.createElement('div');dot.className='ddot dot-b';dots.appendChild(dot);}
      }
      cell.appendChild(dots);
    }
    grid.appendChild(cell);
  }
}

window.aCalChange = function(d) {
  aCalM+=d;
  if(aCalM<0){aCalM=11;aCalY--;}
  if(aCalM>11){aCalM=0;aCalY++;}
  renderAdminCal();
};

// ── 탭 전환 ──
window.switchTab = function(tab, btn) {
  ['list','cal','add'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===tab?'block':'none';
  });
  document.querySelectorAll('.tabs:first-of-type .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='cal') renderAdminCal();
};

// ── 토스트 ──
window.showToast = function(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
};
</script>
